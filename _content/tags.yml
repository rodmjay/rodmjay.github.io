# Blog tags, one list for both languages. A post's `tags` use the key; the page shows the name in its language.
# Tag pages are /blog/tag/<English name as a slug>/ and /es/blog/tag/<Spanish name as a slug>/.
tags:
  - { key: ai, en: AI, es: IA }
  - { key: architecture, en: Architecture, es: Arquitectura }
  - { key: delivery, en: Delivery, es: Entrega }
  - { key: focus, en: Focus, es: Enfoque }
  - { key: habits, en: Habits, es: Hábitos }
  - { key: leadership, en: Leadership, es: Liderazgo }
  - { key: standards, en: Standards, es: Estándares }
