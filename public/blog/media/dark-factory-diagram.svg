<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Requirement sinks compose into a versioned specification; agents build the diff; any source becomes a sink through a small MCP contract.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa3c7"/>
    </marker>
    <style>
      text { font-family: 'Space Grotesk', system-ui, -apple-system, Segoe UI, sans-serif; }
      .h  { fill:#eef1ff; font-weight:700; }
      .l  { fill:#eef1ff; font-weight:600; }
      .s  { fill:#9aa3c7; }
      .k  { fill:#9aa3c7; letter-spacing:.12em; font-weight:600; }
      .box{ fill:#101631; }
      .flow{ stroke:#9aa3c7; stroke-width:2; fill:none; }
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="708" rx="20" fill="#0b1020" stroke="#1e2747" stroke-width="2"/>

  <text x="44" y="58" class="h" font-size="30">The living specification</text>
  <text x="44" y="88" class="s" font-size="17">Requirements in. Spec and diff out.</text>

  <!-- Sinks -->
  <text x="44" y="140" class="k" font-size="14">SINKS</text>
  <g>
    <rect x="44" y="152" width="236" height="66" rx="12" class="box" stroke="#35e0d8" stroke-width="2"/>
    <text x="64" y="186" class="l" font-size="20">Product</text>
    <text x="64" y="207" class="s" font-size="13">owner: product</text>

    <rect x="44" y="236" width="236" height="66" rx="12" class="box" stroke="#8b7cff" stroke-width="2"/>
    <text x="64" y="270" class="l" font-size="20">Standards</text>
    <text x="64" y="291" class="s" font-size="13">owner: platform</text>

    <rect x="44" y="320" width="236" height="66" rx="12" class="box" stroke="#ff5d8f" stroke-width="2"/>
    <text x="64" y="354" class="l" font-size="20">Security</text>
    <text x="64" y="375" class="s" font-size="13">owner: security</text>
  </g>

  <!-- Compose -->
  <path class="flow" d="M280 185 L352 255" marker-end="url(#ah)"/>
  <path class="flow" d="M280 269 L352 269" marker-end="url(#ah)"/>
  <path class="flow" d="M280 353 L352 283" marker-end="url(#ah)"/>
  <rect x="356" y="214" width="150" height="110" rx="14" class="box" stroke="#3ddc84" stroke-width="2"/>
  <text x="431" y="266" class="l" font-size="20" text-anchor="middle">Compose</text>
  <text x="431" y="290" class="s" font-size="13" text-anchor="middle">(derive, don't</text>
  <text x="431" y="307" class="s" font-size="13" text-anchor="middle">maintain)</text>

  <!-- Spec versions -->
  <text x="556" y="150" class="k" font-size="14">SPECIFICATION</text>
  <path class="flow" d="M506 269 L556 269" marker-end="url(#ah)"/>
  <rect x="560" y="196" width="150" height="110" rx="12" class="box" stroke="#2a3a66" stroke-width="2"/>
  <rect x="580" y="214" width="150" height="110" rx="12" class="box" stroke="#2a3a66" stroke-width="2"/>
  <rect x="600" y="232" width="150" height="110" rx="12" class="box" stroke="#35e0d8" stroke-width="2"/>
  <text x="620" y="268" class="s" font-size="14">v1</text>
  <text x="620" y="290" class="s" font-size="14">v2</text>
  <text x="675" y="297" class="l" font-size="22" text-anchor="middle">v3</text>

  <!-- diff -->
  <path class="flow" d="M750 287 L812 287" marker-end="url(#ah)"/>
  <rect x="814" y="262" width="120" height="50" rx="25" class="box" stroke="#ff5d8f" stroke-width="2"/>
  <text x="874" y="293" class="l" font-size="17" text-anchor="middle">diff v2 to v3</text>

  <!-- Agent -->
  <path class="flow" d="M934 287 L980 287" marker-end="url(#ah)"/>
  <rect x="982" y="232" width="172" height="110" rx="14" class="box" stroke="#3ddc84" stroke-width="2"/>
  <text x="1068" y="284" class="l" font-size="20" text-anchor="middle">Agent</text>
  <text x="1068" y="308" class="s" font-size="13" text-anchor="middle">builds only</text>
  <text x="1068" y="325" class="s" font-size="13" text-anchor="middle">the change</text>

  <!-- divider -->
  <line x1="44" y1="430" x2="1156" y2="430" stroke="#1e2747" stroke-width="2"/>

  <!-- MCP contract -->
  <text x="44" y="474" class="k" font-size="14">MCP CONTRACT</text>
  <rect x="44" y="486" width="1112" height="60" rx="30" class="box" stroke="#35e0d8" stroke-width="2"/>
  <text x="600" y="523" class="l" font-size="20" text-anchor="middle">list  ·  get a version  ·  diff two versions</text>

  <!-- sources feed the contract -->
  <g>
    <path class="flow" d="M150 636 L150 548" marker-end="url(#ah)"/>
    <path class="flow" d="M420 636 L420 548" marker-end="url(#ah)"/>
    <path class="flow" d="M690 636 L690 548" marker-end="url(#ah)"/>
    <path class="flow" d="M960 636 L960 548" marker-end="url(#ah)"/>

    <rect x="66" y="638" width="168" height="48" rx="10" class="box" stroke="#8b7cff" stroke-width="2"/>
    <text x="150" y="668" class="l" font-size="16" text-anchor="middle">repo</text>
    <rect x="336" y="638" width="168" height="48" rx="10" class="box" stroke="#8b7cff" stroke-width="2"/>
    <text x="420" y="668" class="l" font-size="16" text-anchor="middle">Postgres table</text>
    <rect x="606" y="638" width="168" height="48" rx="10" class="box" stroke="#8b7cff" stroke-width="2"/>
    <text x="690" y="668" class="l" font-size="16" text-anchor="middle">ticket system</text>
    <rect x="876" y="638" width="168" height="48" rx="10" class="box" stroke="#8b7cff" stroke-width="2"/>
    <text x="960" y="668" class="l" font-size="16" text-anchor="middle">design tool</text>
  </g>

  <text x="1156" y="474" class="s" font-size="14" text-anchor="end">anything that speaks it becomes a sink</text>
</svg>
