# Blog editor (Sveltia CMS, loaded by admin/index.html). It commits markdown to main; after the Azure cutover main is the
# Next.js source, and the "Deploy to Azure Static Web Apps" workflow builds and deploys it (images go to public/blog/media,
# served at /blog/media). Until cutover, edit from rodmjay.com/admin/ (Pages), not from the staging copy.
# Sign in with a GitHub fine-grained token for this one repository (Contents: read and write).
# A post is two entries, English and Spanish, edited side by side and tied by `id`. Nothing goes live until both
# languages have Draft switched off; the build refuses a live post without its twin.
backend:
  name: github
  repo: rodmjay/rodmjay.github.io
  branch: main
  commit_messages:
    create: "Blog: add {{collection}} “{{slug}}” (editor)"
    update: "Blog: update {{collection}} “{{slug}}” (editor)"
    delete: "Blog: delete {{collection}} “{{slug}}” (editor)"
    uploadMedia: "Blog: upload “{{path}}” (editor)"
    deleteMedia: "Blog: delete “{{path}}” (editor)"
site_url: https://rodmjay.com/blog/
display_url: https://rodmjay.com/blog/
media_folder: public/blog/media
public_folder: /blog/media
slug:
  encoding: ascii
  clean_accents: true
i18n:
  structure: multiple_folders
  locales: [en, es]
  default_locale: en
  canonical_slug:
    key: id
    value: "{{slug}}"
collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _content/posts
    extension: md
    format: yaml-frontmatter
    create: true
    i18n: true
    slug:
      template: "{{title}}"
      editable: true
      i18n: true
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true, hint: "Sentence case." }
      - name: dek
        label: Dek
        widget: text
        i18n: true
        hint: "One sentence under the title, 180 characters at most. Spanish uses usted."
        pattern: ['^[\s\S]{1,180}$', "180 characters at most"]
      - { name: date, label: Date, widget: datetime, i18n: duplicate, format: YYYY-MM-DD, time_format: false }
      - name: tags
        label: Tags
        widget: relation
        i18n: duplicate
        collection: tags
        file: tags
        value_field: "tags.*.key"
        display_fields: ["tags.*.en"]
        search_fields: ["tags.*.en"]
        multiple: true
        required: false
      - { name: cover, label: Cover image (16:9), widget: image, i18n: duplicate, required: false }
      - { name: cover_alt, label: Cover alt text, widget: string, i18n: true, required: false, hint: "Required when there's a cover, in both languages." }
      - { name: toc, label: Always show "On this page", widget: boolean, i18n: duplicate, required: false, default: false, hint: "It shows anyway with 4 or more sections." }
      - { name: draft, label: Draft, widget: boolean, i18n: true, default: true, hint: "Leave on until Rod says yes to the exact text. Live only when both languages are off." }
      - name: body
        label: Body
        widget: markdown
        i18n: true
        modes: [raw, rich_text]
        hint: "Code: ```lang title=\"file\" {3}. Pull quote: ::: pullquote … :::. Wide figure: ::: wide … :::. Images need alt text; a title becomes the caption. Footnotes: [^1]."
  - name: tags
    label: Tags
    files:
      - name: tags
        label: Tags (English and Spanish)
        file: _content/tags.yml
        fields:
          - name: tags
            label: Tags
            widget: list
            summary: "{{en}} / {{es}}"
            fields:
              - { name: key, label: Key, widget: string, hint: "Lowercase, never changes once used." }
              - { name: en, label: English, widget: string }
              - { name: es, label: Spanish, widget: string }
