# Builds the Next.js site, tests it, and deploys out/ to Azure Static Web Apps (Free), docs/adr/0002.
# Login is OIDC with a user-assigned identity whose only role is to read the app and list its deployment token, so
# nothing long-lived is stored in GitHub: the token is fetched at run time, masked, and used once.
# Repo variables (not secrets): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_SWA_NAME,
# AZURE_SWA_RESOURCE_GROUP; and the recipe switches RECIPES_LIVE (nav item) and RECIPES_APPROVED (sample state off).
# Until cutover this deploys `next` to the app's own host (staging); GitHub Pages keeps serving main. At cutover the
# branch below becomes main (the federated credential for main already exists), and the daily run picks up recipes.
# The Should page (/should/) is copied in from rodmjay/should (Product Manager's) after the build, byte-identical, with
# its own CSP (scripts/should.mjs). Product Manager's pushes reach the site with the daily run or a manual run.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [next]
  # Daily, so recipes published in Supabase and Product Manager's pushes to rodmjay/should reach the site. A schedule
  # runs only from the default branch (main), so until cutover it doesn't run for `next`: use workflow_dispatch on
  # `next` (Actions, "Run workflow") to pick up a Should page change on staging.
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-swa
  cancel-in-progress: false

env:
  RECIPES_API: https://ibrovaaqbddkhqsmadqk.supabase.co/functions/v1/public-recipes
  RECIPES_LIVE: ${{ vars.RECIPES_LIVE }}
  RECIPES_APPROVED: ${{ vars.RECIPES_APPROVED }}
  NEXT_TELEMETRY_DISABLED: "1"
  # The privacy page's hosting line (src/lib/site.mjs): "azure" plus the day it changed (YYYY-MM-DD), set in the cutover
  # merge only after Compliance approves the exact words (docs/adr/0002). Empty = the GitHub line that's live today.
  PRIVACY_HOSTING: ""
  PRIVACY_UPDATED: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      # The Should page: rodmjay/should's main, copied to out/should/ after postbuild (its no-inline-code guards are for
      # the Next output only), with routes and a hash-based CSP written into out/staticwebapp.config.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rodmjay/should
          ref: main
          path: _should
          persist-credentials: false
      - name: Add the Should page
        run: node scripts/should.mjs _should
      - name: Every old URL still exists
        run: npm run test:urls
      - name: Accessibility and navigation tests
        run: |
          npx playwright install --with-deps chromium
          CI=1 npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: out
          retention-days: 3

  deploy:
    needs: build
    if: vars.AZURE_CLIENT_ID != '' # skipped until IT Guy sets the Azure variables after applying the Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC to Azure
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: out
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch the deployment token (masked, this run only)
        env:
          SWA: ${{ vars.AZURE_SWA_NAME }}
          RG: ${{ vars.AZURE_SWA_RESOURCE_GROUP }}
        run: |
          token="$(az staticwebapp secrets list --name "$SWA" --resource-group "$RG" --query properties.apiKey -o tsv)"
          test -n "$token" || { echo "no deployment token returned"; exit 1; }
          echo "::add-mask::$token"
          echo "SWA_DEPLOY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy out/
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: out
          skip_app_build: true
          skip_api_build: true
          # Only main publishes to production; every other branch goes to the named preview environment "staging"
          # (Security, psh #70: a deploy that names no environment publishes to production).
          deployment_environment: ${{ github.ref_name == 'main' && '' || 'staging' }}
      - name: Log out
        if: always()
        run: az logout || true
