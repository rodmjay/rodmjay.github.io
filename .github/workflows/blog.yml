# Builds the blog from markdown (_content/) and commits the pages to main, which GitHub Pages already serves
# (source: branch main, /). No Pages settings change needed. A push made with GITHUB_TOKEN doesn't start this
# workflow again, so there's no loop. The editor at /admin/ commits markdown here, which starts this build.
name: Build the blog

on:
  push:
    branches: [main]
    paths:
      - "_content/**"
      - "blog/blog.css"
      - "blog/blog.js"
      - "blog/media/**"
      - "src/blog-strip*.svg"
      - "scripts/build-blog.mjs"
      - "i18n/**"
      - "ds/**"
      - "site.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and commit the pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/build-blog.mjs
            git add -A blog es/blog sitemap.xml
            if git diff --cached --quiet; then echo "Pages already match the markdown."; exit 0; fi
            git commit -q -m "Blog: build from ${GITHUB_SHA::7}"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved; rebuilding on the new head"
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
